services:
  main:
    container_name: cats-main
    build:
      context: ./
      dockerfile: dockerfiles/cats-main.dockerfile
    volumes:
      - type: bind
        source: ./
        target: /app
      - type: bind
        source: ~/Config-judge.pm
        target: /app/cgi-bin/cats-problem/CATS/Config.pm
      - v-main-apache-log:/var/log/apache2
    env_file:
      - .env
    ports:
      - "127.0.0.1:${CATS_MAIN_HOST_PORT}:80"
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
        restart: true

  database:
    container_name: cats-database
    image: postgres:18
    volumes:
      - v-database-data:/var/lib/postgresql
      - ./postgres-etc:/etc/postgresql
    restart: unless-stopped
    command: postgres -c config_file=/etc/postgresql/18/main/postgresql.conf
    stop_grace_period: 30s
    environment:
      PGDATA: /var/lib/postgresql/18/main
    env_file:
      - .env
    expose:
      - "5432"
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  judge:
    container_name: cats-judge
    privileged: true
    cgroup: host
    # Built from dockerfiles/cats-judge.dockerfile on a dev machine and pushed to
    # the registry; hosts just `docker compose pull judge`. Bump the tag per build.
    image: registry.mesenev.ru/mesenev/cats-judge:2026-10-28b
    build:
      context: ./dockerfiles
      dockerfile: cats-judge.dockerfile
    env_file:
      - .env
    volumes:
      - type: bind
        source: ./cats-judge
        target: /app
      - ~/local-judge.xml:/app/config/local.xml:ro
      - ~/Config-judge.pm:/app/lib/cats-problem/CATS/Config.pm:ro
      - /judge-run:/app/run
      - /judge-cache:/app/cache
    depends_on:
      database:
        condition: service_healthy
        restart: true
    restart: always

volumes:
  v-main-apache-log:
  v-database-data:
