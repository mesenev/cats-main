PerlSetEnv CATS_DIR /app/cgi-bin/
<VirtualHost *:80>
	PerlRequire /app/cgi-bin/CATS/Web/startup.pl
	<Directory "/app/cgi-bin/">
		Options -Indexes
		LimitRequestBody 1048576
		Require all granted
		PerlSendHeader On
		SetHandler perl-script
		PerlResponseHandler main
	</Directory>
	ExpiresActive On
	ExpiresDefault "access plus 5 seconds"
	ExpiresByType text/css "access plus 1 week"
	ExpiresByType application/javascript "access plus 1 week"
	ExpiresByType image/gif "access plus 1 week"
	ExpiresByType image/png "access plus 1 week"
	ExpiresByType image/x-icon "access plus 1 week"

	Alias /cats/static/css/ "/app/css/"
	Alias /cats/static/ "/app/static/"
	<Directory "/app/static">
		# Apache allows only absolute URL-path
		ErrorDocument 404 /cats/?f=static
		AddDefaultCharset utf-8
		Require all granted
	</Directory>

	Alias /cats/junior/ "/app/junior/"
	<Directory "/app/ev">
		AddDefaultCharset utf-8
		Require all granted
	</Directory>

	Alias /cats/download/ "/app/download/"
	<Directory "/app/download">
		Options -Indexes
		Require all granted
		AddCharset utf-8 .txt
	</Directory>

	Alias /cats/docs/ "/app/docs/"
	<Directory "/app/docs">
		AddDefaultCharset utf-8
		Require all granted
	</Directory>

	Alias /cats/css/ "/app/css/"
	<Directory "/app/css/">
		AllowOverride Options=Indexes,MultiViews,ExecCGI FileInfo
		Require all granted
	</Directory>

	Alias /favicon.ico "/app/images/favicon.ico"
	Alias /cats/images/ "/app/images/"
	<Directory "/app/images/">
		AllowOverride Options=Indexes,MultiViews,ExecCGI FileInfo
		Require all granted
	</Directory>

	Alias /cats/js/ "/app/js/"
	<Directory "/app/js/">
		AllowOverride Options=Indexes,MultiViews,ExecCGI FileInfo
		Require all granted
	</Directory>

	Alias /cats/ "/app/cgi-bin/"
	Alias /cats "/app/cgi-bin/"
	Alias / "/app/cgi-bin/"
</VirtualHost>
